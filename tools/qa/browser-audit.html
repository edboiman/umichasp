<!doctype html><html><head><meta charset="utf-8"><base href="../../"><title>ASP Guide UI audit</title><style>
body{margin:0;background:#e9edf1;color:#172f40;font:14px/1.5 system-ui}header{position:sticky;top:0;background:white;padding:10px 18px;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #bccbd5}select,button{font:inherit;padding:8px;border:1px solid #bbc9d2;border-radius:5px;background:white}button{cursor:pointer}iframe{display:block;background:white;border:1px solid #bbc9d2;margin:18px auto;height:850px;max-width:none}#status{margin:0}pre{white-space:pre-wrap;max-height:360px;overflow:auto;margin:16px;padding:16px;background:white}h1{font-size:14px;margin:0 8px 0 0}
</style></head><body><header><h1>UI audit</h1><select id="width" aria-label="Viewport width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1440</option></select><select id="theme" aria-label="Color mode"><option>light</option><option>dark</option></select><select id="route" aria-label="App route"></select><button id="run">Run complete audit</button><p id="status" role="status">Ready</p></header><iframe id="app" title="App preview" width="390"></iframe><pre id="results" aria-label="Audit results"></pre><script>
const $=id=>document.getElementById(id), frame=$('app'), norm=s=>(s||'').replace(/\s+/g,' ').trim();
let pages,tax,drugs,routes,segments=new Map(),busy=false,loadSerial=0;
const originalStorage=Object.fromEntries(Object.keys(localStorage).filter(k=>k.startsWith('asp.')).map(k=>[k,localStorage.getItem(k)]));
const report={viewportChecks:0,routeChecks:0,contentPages:[],failures:[],warnings:[],linksChecked:0,tableChecks:0,detailsChecked:0,interactionChecks:[]};
const nextPaint=()=>Promise.resolve();
function chunks(p){const out=[];const run=r=>(r||[]).map(x=>x[0]).join('');for(const b of p.guide?.blocks||p.blocks){if(b.t==='table'){if(b.caption)out.push(b.caption);out.push(...(b.head||[]).filter(Boolean));for(const row of b.rows)for(const cell of row){if(p.guide)for(const para of cell)out.push(run(para));else out.push(cell);}}else if(b.t==='flow'){for(const c of b.cols){if(c.head)out.push(c.head);for(const n of c.nodes)for(const para of n.p)out.push(run(para));}for(const note of b.notes||[])for(const para of note)out.push(run(para));}else if(b.t==='rec')out.push(...b.lines);else if(b.t!=='fig')out.push(p.guide?run(b.r):b.x);}
 out.push(...(p.guide?.refs||[]));for(const h of p.guide?.history||[])out.push(...h);return out.map(norm).filter(Boolean);}
function navigation(hash){frame.contentWindow.route(hash);return Promise.resolve();}
function loadFrame(width,theme,pop='all',route='#/'){return new Promise((resolve,reject)=>{frame.width=width;localStorage.setItem('asp.pop',JSON.stringify(pop));frame.onload=()=>{const started=Date.now();const poll=()=>{if(frame.contentDocument?.querySelector('#view h1,#view .empty-state'))return resolve();if(Date.now()-started>12000)return reject(new Error('Load timeout'));setTimeout(poll,20);};poll();};frame.src='./?theme='+theme+'&audit='+(++loadSerial)+route;});}
function fail(kind,route,width,theme,extra){report.failures.push({kind,route,width,theme,...extra});}
function check(route,width,theme,content=false){const doc=frame.contentDocument,w=frame.contentWindow;report.routeChecks++;const body=doc.querySelector('#view');if(!body?.textContent.trim())fail('empty',route,width,theme,{});
 const overflow=doc.documentElement.scrollWidth-doc.documentElement.clientWidth;if(overflow>1){const offenders=[...doc.querySelectorAll('body *')].filter(x=>{const r=x.getBoundingClientRect();return r.width&&r.right>width+1&&!x.closest('.table-viewport,.rd-table,.hscroll')}).slice(0,5).map(x=>({tag:x.tagName,cls:x.className,w:x.getBoundingClientRect().width}));fail('page-overflow',route,width,theme,{overflow,offenders});}
 const known=(href)=>{if(!href?.startsWith('#/') || href==='#/')return true;const [a,b]=href.slice(2).split('?')[0].split('/').map(decodeURIComponent);return ['conditions','drugs','res','files','staff','search','saved','about','organisms'].includes(a)||a==='p'&&pages.some(p=>p.id===b)||a==='c'&&tax.conditions.some(c=>c.id===b)||a==='d'&&drugs.some(d=>d.name===b)||a==='r'&&tax.resources.some(r=>r.id===b)||a==='o'&&['enterococcus','staph-aureus','gas','candida'].includes(b);};for(const a of doc.querySelectorAll('a[href]')){report.linksChecked++;if(!known(a.getAttribute('href')))fail('broken-internal-target',route,width,theme,{href:a.getAttribute('href')});}
 const tooSmall=[...doc.querySelectorAll('button,summary,.tabs a,.row,.chip,.btn,.seg-btn')].filter(x=>{const r=x.getBoundingClientRect();return r.width&&r.height&&(r.height<43.5||r.width<43.5)});if(tooSmall.length)fail('touch-target',route,width,theme,{elements:tooSmall.slice(0,4).map(x=>({tag:x.tagName,cls:x.className,text:x.textContent.slice(0,40),height:x.getBoundingClientRect().height,width:x.getBoundingClientRect().width}))});
 if(content){const id=decodeURIComponent(route.slice(4).split('?')[0]),p=pages.find(x=>x.id===id);if(p){const text=norm(body.textContent),missing=segments.get(id).filter(s=>!text.includes(s));if(missing.length)fail('content-missing',route,width,theme,{missing:missing.slice(0,10)});if(!report.contentPages.includes(id))report.contentPages.push(id);
  for(const [i,b]of(p.guide?.blocks||[]).entries())if(b.t==='table'&&!(id==='guidelines~outpatient~GAS-adult'&&i===2)){const table=doc.querySelector('#g'+i+' table');if(!table)fail('table-missing',route,width,theme,{block:i});else{if(table.tBodies[0].rows.length!==b.rows.length)fail('table-row-count',route,width,theme,{block:i});for(let ri=0;ri<b.rows.length;ri++)if(table.tBodies[0].rows[ri].cells.length< b.rows[ri].length)fail('table-cell-count',route,width,theme,{block:i,row:ri});report.tableChecks++;}}
 }}
 return doc;}
async function expandDetails(doc){for(const d of doc.querySelectorAll('details')){d.open=true;report.detailsChecked++;}await nextPaint();}
function summary(){return {routeChecks:report.routeChecks,viewportChecks:report.viewportChecks,contentPages:report.contentPages.length,tableChecks:report.tableChecks,detailsChecked:report.detailsChecked,failures:report.failures.length,warnings:report.warnings.length};}
async function run(){if(busy)return;busy=true;$('run').disabled=true;report.startedAt=new Date().toISOString();try{
 for(const width of [320,375,390,430,768,1440])for(const theme of ['light','dark']){await loadFrame(width,theme);report.viewportChecks++;let n=0;for(const r of routes){await navigation(r.hash);check(r.hash,width,theme,!!r.page);if(r.page){await expandDetails(frame.contentDocument);check(r.hash,width,theme,true);}n++;if(n%15===0){$('status').textContent=width+'px · '+theme+' · '+n+'/'+routes.length+' · '+report.failures.length+' issues';$('results').textContent=JSON.stringify({summary:summary(),recent:report.failures.slice(-6)},null,2);await nextPaint();}}
 }
 // Population and empty/filter/search states, all condition, agent, resource, and organism routes.
 for(const pop of ['adult','peds']){await loadFrame(320,'light',pop);for(const r of routes.filter(x=>!x.page)){await navigation(r.hash);check(r.hash,320,'light');}}
 await loadFrame(390,'light');const doc=frame.contentDocument;
 await navigation('#/p/guidelines~outpatient~GAS-adult');const star=doc.querySelector('#star');star.click();if(star.getAttribute('aria-pressed')!=='true')throw Error('Bookmark save');star.click();report.interactionChecks.push('Save/remove bookmark');
 const before=doc.documentElement.style.getPropertyValue('--rd-scale');doc.querySelector('#aa').click();if(doc.documentElement.style.getPropertyValue('--rd-scale')===before)throw Error('Text size did not change');report.interactionChecks.push('Text-size cycle');
 await navigation('#/search?q=amoxicillin');if(!doc.querySelector('mark'))throw Error('Search highlight absent');report.interactionChecks.push('Search results/highlights');
 await navigation('#/p/guidelines~outpatient~GAS-adult?q=amoxicillin&b=2');await new Promise(r=>frame.contentWindow.requestAnimationFrame(r));if(!doc.querySelector('.flash'))throw Error('Search deep link');report.interactionChecks.push('Search passage deep link');
 await navigation('#/about');doc.querySelector('.appearance-control button:last-child').click();if(doc.documentElement.dataset.theme!=='dark')throw Error('Dark mode');report.interactionChecks.push('Appearance control');
 await navigation('#/o/enterococcus');const links=[...doc.querySelectorAll('#view .row')];if(links.length!==2)throw Error('Enterococcus infection choices');await navigation('#/o/enterococcus/endo');if(!doc.querySelector('#view .row'))throw Error('Endocarditis options absent');report.interactionChecks.push('Enterococcus → infection → guideline');
 // All internal rendered navigation targets are validated against the original route inventory.
 await navigation('#/conditions');for(const label of ['Adult','Pediatric','All']){const button=[...doc.querySelectorAll('.seg-btn')].find(x=>x.textContent===label);button.click();if([...doc.querySelectorAll('.seg-btn')].find(x=>x.textContent===label).getAttribute('aria-checked')!=='true')throw Error('Population selection '+label);}report.interactionChecks.push('All/adult/pediatric radio controls');
 const inputTest=async(route,query)=>{await navigation(route);let input=doc.querySelector('input');input.value=query;input.dispatchEvent(new Event('input',{bubbles:true}));await new Promise(r=>setTimeout(r,170));if(!doc.querySelector('#view').textContent.trim())throw Error('Filter output '+route);input.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));if(input.value!=='')throw Error('Escape reset '+route);};
 await inputTest('#/conditions','pneumonia');await inputTest('#/drugs','Zosyn');await inputTest('#/search','amoxicillin');await inputTest('#/files','zzzzzz');await inputTest('#/staff','zzzzzz');report.interactionChecks.push('Condition, agent, global, file, and staff filters; Escape reset');
 await navigation('#/p/guidelines~outpatient~GAS-adult');const detail=doc.querySelector('.reader-contents');detail.querySelector('summary').click();if(!detail.open)throw Error('Contents expansion');detail.querySelector('summary').click();if(detail.open)throw Error('Contents collapse');report.interactionChecks.push('Disclosure open/close');
 frame.width=320;for(let i=0;i<4;i++){doc.querySelector('#aa').click();check('#/p/guidelines~outpatient~GAS-adult',320,'dark',true);}report.interactionChecks.push('All four reading text sizes at 320px');
 for(const href of ['#/conditions','#/drugs','#/res','#/saved','#/']){await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Tab click '+href)),5000);frame.contentWindow.addEventListener('asp:route',()=>{clearTimeout(timer);resolve();},{once:true});doc.querySelector('.tabs a[href="'+href+'"]').click();});}report.interactionChecks.push('Five bottom navigation links through hashchange router');
 await navigation('#/saved');const clear=doc.querySelector('.btn-quiet');if(clear){clear.click();if(doc.querySelector('.btn-quiet'))throw Error('Clear recents');}report.interactionChecks.push('Clear recent history');
 await navigation('#/res');report.completedAt=new Date().toISOString();report.status='complete';
 }catch(error){report.status='failed';report.failures.push({kind:'runner-error',message:String(error)});}finally{$('status').textContent='Finished · '+JSON.stringify(summary());$('results').textContent=JSON.stringify(report,null,2);$('run').disabled=false;busy=false;for(const k of Object.keys(localStorage).filter(k=>k.startsWith('asp.')))localStorage.removeItem(k);for(const[k,v]of Object.entries(originalStorage))localStorage.setItem(k,v);}}
Promise.all(['data/content.json','data/taxonomy.json','data/drugs.json'].map(x=>fetch(x).then(r=>r.json()))).then(async([d,t,ds])=>{pages=d.pages;tax=t;drugs=ds;for(const p of pages)segments.set(p.id,chunks(p));routes=[...['#/','#/conditions','#/drugs','#/res','#/files','#/staff','#/search','#/saved','#/about','#/unknown','#/organisms'].map(hash=>({hash})),...pages.map(p=>({hash:'#/p/'+encodeURIComponent(p.id),page:true})),...tax.conditions.map(c=>({hash:'#/c/'+c.id})),...tax.resources.map(r=>({hash:'#/r/'+r.id})),...drugs.map(d=>({hash:'#/d/'+encodeURIComponent(d.name)})),...['#/conditions?f=zzzzzz','#/drugs?f=zzzzzz','#/search?q=zzzzzz','#/search?q=amoxicillin','#/search?q=penicillin%20allergy','#/p/missing','#/c/missing','#/d/missing','#/r/missing','#/o/enterococcus','#/o/enterococcus/uti','#/o/enterococcus/endo','#/o/staph-aureus','#/o/gas','#/o/candida','#/o/staph-aureus/sab','#/o/staph-aureus/endo','#/o/staph-aureus/ssti','#/o/staph-aureus/bsi','#/o/gas/gas','#/o/candida/candida','#/o/missing','#/o/enterococcus/missing'].map(hash=>({hash}))];$('route').replaceChildren(...routes.map(r=>Object.assign(document.createElement('option'),{value:r.hash,textContent:r.page?pages.find(p=>r.hash.endsWith(encodeURIComponent(p.id))).title:r.hash})));$('route').value='#/p/guidelines~outpatient~GAS-adult';await loadFrame(390,'light','all',$('route').value);});
$('run').onclick=run;for(const id of ['width','theme','route'])$(id).onchange=()=>loadFrame($('width').value,$('theme').value,'all',$('route').value);
</script></body></html>
